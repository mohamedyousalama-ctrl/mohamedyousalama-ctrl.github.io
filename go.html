<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0B0B0B" />
<title>ذا ويكند | اختبار الفريق</title>
<style>
:root{--bg:#0B0B0B;--card:#171717;--line:#2A2A2A;--gold:#C6A15B;--gold2:#E8C98A;--cream:#F4EDE0;--muted:#9A9388;--ok:#3DDC97;--bad:#E85D5D;--safe:env(safe-area-inset-bottom,16px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--cream);font-family:"SF Arabic","Segoe UI","Tahoma","Arial",sans-serif;min-height:100%}
body{max-width:560px;margin:0 auto;min-height:100dvh}
button,input,textarea,select{font-family:inherit}
.screen{min-height:100dvh;display:flex;flex-direction:column;padding:20px 18px calc(28px + var(--safe))}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.logo b{letter-spacing:.18em;font-size:12px;color:var(--gold)}
.logo span{font-size:22px;font-weight:700}
.chip{font-size:11px;border:1px solid var(--line);color:var(--muted);padding:6px 10px;border-radius:999px}
h1{font-size:26px;line-height:1.35;margin:8px 0 10px}
.lead{color:var(--muted);font-size:14px;line-height:1.8}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--gold2);margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;background:#101010;border:1px solid var(--line);color:var(--cream);border-radius:12px;padding:12px;font-size:16px}
.field textarea{min-height:120px;resize:vertical;line-height:1.7}
.btn{appearance:none;border:0;border-radius:14px;padding:14px 16px;font-size:16px;font-weight:600;cursor:pointer;width:100%}
.btn-gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1A1408}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--cream);margin-top:8px}
.btn:disabled{opacity:.45}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.progress{flex:1;height:6px;background:#222;border-radius:99px;overflow:hidden}
.bar{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:14px}
.qcat{font-size:12px;color:var(--gold);margin:0 0 6px}
.qtitle{font-size:20px;margin:0 0 8px;line-height:1.45}
.qtext{color:#D9D1C4;font-size:14px;line-height:1.8;margin:0 0 16px}
.opt{display:block;background:#101010;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;cursor:pointer}
.opt.on{border-color:var(--gold);background:#1B170F}
.opt .k{display:inline-flex;width:22px;height:22px;border-radius:50%;border:1px solid var(--gold);align-items:center;justify-content:center;font-size:11px;margin-left:8px;color:var(--gold)}
.opt.on .k{background:var(--gold);color:#1A1408}
.nav{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;margin-top:16px}
.gate{font-size:11px;color:#E8C98A;border:1px solid #3A3018;background:#1A160C;padding:8px 10px;border-radius:10px;margin-bottom:12px}
.done-score{font-size:42px;color:var(--gold);margin:8px 0}
.list{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.row{display:flex;justify-content:space-between;gap:10px;background:#101010;border-radius:12px;padding:10px 12px;font-size:13px}
.good{color:var(--ok)}.weak{color:var(--bad)}
.hidden{display:none !important}
.admin-item{padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer}
.small{font-size:12px;color:var(--muted)}
.timerbox{display:flex;flex-direction:column;align-items:flex-start;background:#1B170F;border:1px solid #3A3018;border-radius:10px;padding:4px 8px;min-width:76px}
.timerbox span{font-size:10px;color:var(--muted)}
.timer{font-variant-numeric:tabular-nums;color:var(--gold2);font-size:16px;font-weight:700}
.timer.low{color:#E85D5D}
.footer-link{text-align:center;margin-top:16px}
.footer-link button{background:none;border:0;color:var(--muted);font-size:12px;cursor:pointer}
.detail{white-space:pre-wrap;font-size:13px;line-height:1.7}
</style>
</head>
<body>
<div id="app"><p style="padding:24px;color:#9A9388">جاري التحميل…</p></div>
<script src="https://cdn.jsdelivr.net/gh/mohamedyousalama-ctrl/mohamedyousalama-ctrl.github.io@22b7a769ece974259e5e206ba0ed8a4b104330ea/tracks.js"></script>
<script src="https://cdn.jsdelivr.net/gh/mohamedyousalama-ctrl/mohamedyousalama-ctrl.github.io@fe06698b20c0ad67186c2750692578d46b5211aa/app-v5.js"></script>
</body>
</html>
